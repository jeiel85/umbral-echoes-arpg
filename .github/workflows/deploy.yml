name: Deploy to GitHub Pages

# Pages 소스는 gh-pages 브랜치(legacy)이고 github-pages 환경은 gh-pages 브랜치만 허용한다.
# 그래서 Actions 배포(deploy-pages) 대신 main 빌드 결과(dist/)를 gh-pages 브랜치에 커밋해 배포한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages
          git worktree add -B gh-pages "$RUNNER_TEMP/site" origin/gh-pages
          rsync -a --delete --exclude .git dist/ "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          git add -A
          # 내용이 같아도 커밋해 gh-pages에 배포된 main 커밋을 남기고 Pages 빌드를 트리거한다.
          git commit --allow-empty -m "deploy: main ${GITHUB_SHA::7}"
          git push origin gh-pages
